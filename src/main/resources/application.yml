spring:
  application:
    name: fcms
  datasource:
    url: ${FCMS_DB_URL:jdbc:postgresql://localhost:5432/fcms}
    username: ${FCMS_DB_USERNAME:postgres}
    password: ${FCMS_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  web:
    resources:
      cache:
        period: 365d
server:
  tomcat:
    # 500 split entries plus 50 transaction headers fit within a bounded form.
    max-parameter-count: 2000
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    org.hibernate.SQL: warn
fcms:
  backup:
    pg-dump: ${FCMS_BACKUP_PG_DUMP:pg_dump}
    interval: ${FCMS_BACKUP_INTERVAL:10000}
  upload-scan:
    enabled: ${FCMS_UPLOAD_SCAN_ENABLED:false}
    port: ${FCMS_UPLOAD_SCAN_PORT:3310}
    timeout: ${FCMS_UPLOAD_SCAN_TIMEOUT:5s}
  storage:
    contract-dir: ${FCMS_CONTRACT_DIR:uploads/contracts}
