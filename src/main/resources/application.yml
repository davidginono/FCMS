spring:
  application:
    name: fcms
  datasource:
    url: ${FCMS_DB_URL:jdbc:postgresql://localhost:5432/fcms}
    username: ${FCMS_DB_USERNAME:fcms}
    password: ${FCMS_DB_PASSWORD:fcms}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  web:
    resources:
      cache:
        period: 365d
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    org.hibernate.SQL: warn
